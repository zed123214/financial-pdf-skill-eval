[pytest]
markers =
    smoke: quick smoke cases
    core: core financial PDF cases
    regression: full regression cases
    abnormal: abnormal input/error cases
    real_las: cases that call real LAS and may cost money
    openclaw: OpenClaw evidence and integration cases
    offline: offline fixture/mock cases
    fixture: pre-generated real_las outputs used as test fixtures

addopts = -ra
testpaths = tests
