case_id: byd_real_las_fixture
name: BYD real_las standard output fixture
description: OpenClaw 触发新版 Skill 后生成的 BYD real_las standard profile 输出，用于离线输出契约和结构统计测试
backend: fixture
output_profile: standard
output_dir: data/real_las_outputs/byd_caibao
ground_truth: evaluation/ground_truth/byd_manual_gt.json
count_as_real_evaluation: true
tags:       # yaml:用#添加注释
  - smoke
  - offline
  - real_las_fixture
  - financial_report
  - fixture
thresholds:
  min_raw_table_count: 1
  min_financial_table_count: 1
  min_metric_record_count: 1
  min_numeric_accuracy: 0.80
validations:
  - type: output_contract
    profile: standard
  - type: data_authenticity
    require_non_synthetic: true
    expected_backend: real_las
  - type: table_stat_ge
    field: financial_table_count
    expected: 1
  - type: metric_stat_ge
    field: metric_record_count
    expected: 1
  - type: gt_numeric_accuracy_ge
    threshold: 0.80
    skip_if_no_ground_truth: true
