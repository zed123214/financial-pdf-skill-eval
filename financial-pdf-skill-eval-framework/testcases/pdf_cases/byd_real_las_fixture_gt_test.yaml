case_id: byd_real_las_fixture_gt_test
name: BYD fixture with human-verified Ground Truth (accuracy test)
description: |
  与 byd_real_las_fixture 共用同一 fixture 输出目录，但指向已填 expected 的 GT 文件，
  用于验证 evaluate_ground_truth → gt_eval_result.json → financial_accuracy 全链路。
backend: fixture
output_profile: standard
output_dir: data/real_las_outputs/byd_caibao
ground_truth: evaluation/ground_truth/byd_real_las_fixture_gt.json
count_as_real_evaluation: true
tags:
  - smoke
  - offline
  - real_las_fixture
  - ground_truth_test
thresholds:
  min_raw_table_count: 1
  min_financial_table_count: 1
  min_metric_record_count: 1
  min_numeric_accuracy: 0.80
validations:
  - type: output_contract
    profile: standard
  - type: data_authenticity
    require_non_synthetic: true
    expected_backend: real_las
  - type: table_stat_ge
    field: financial_table_count
    expected: 1
  - type: metric_stat_ge
    field: metric_record_count
    expected: 1
  - type: gt_numeric_accuracy_ge
    threshold: 0.80
    skip_if_no_ground_truth: true
