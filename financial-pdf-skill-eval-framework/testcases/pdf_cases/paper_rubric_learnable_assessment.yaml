# Learnable Assessment Skills 论文（LAS real_las 解析 fixture）
# 域外学术 PDF：不测 financial_accuracy，以契约 / 表统计 / 文本锚点为主。
case_id: paper_rubric_learnable_assessment
name: 论文-Learnable Assessment Skills（Rubric 构建）
description: >
  arXiv 学术论文 PDF，经 LAS detail 解析的 real_las fixture。
  覆盖双栏长文、LaTeX 公式、插图 crop、实验结果宽表（Table 1 QWK）。
  来源 PDF 见 data/samples/paper_rubric_learnable_assessment.pdf；
  fixture 自 outputs/rubric_eval_v2 迁入。
input_pdf: data/samples/paper_rubric_learnable_assessment.pdf
backend: fixture
output_profile: standard
output_dir: data/real_las_outputs/paper_rubric_learnable_assessment
ground_truth: evaluation/ground_truth/paper_rubric_learnable_assessment_manual_gt.json
count_as_real_evaluation: true
tags:
  - offline
  - real_las_fixture
  - academic_paper
  - out_of_financial_domain
  - formula_heavy
  - figure_heavy
  - experiment_table
thresholds:
  min_raw_table_count: 1
  min_financial_table_count: 0
  min_metric_record_count: 0
validations:
  - type: output_contract
    profile: standard
  - type: data_authenticity
    require_non_synthetic: true
    expected_backend: real_las
  - type: table_stat_ge
    field: raw_table_count
    expected: 1
  - type: table_stat_eq
    field: financial_table_count
    expected: 0
  - type: metric_stat_eq
    field: metric_record_count
    expected: 0
  - type: text_contains
    path: raw/parsed.md
    text: "Learnable Assessment Skills"
  - type: text_contains
    path: raw/parsed.md
    text: "ASAP-SAS"
  - type: text_contains
    path: raw/parsed.md
    text: "Figure 1"
  - type: text_contains
    path: normalized/normalized_tables.json
    text: '"item 1"'
  - type: text_contains
    path: normalized/normalized_tables.json
    text: "0.698"
